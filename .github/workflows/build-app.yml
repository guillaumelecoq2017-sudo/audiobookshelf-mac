name: Build app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Prepare folder
        run: mkdir -p "$HOME/Applications"
      - name: Build
        run: ./build.sh
      - name: Zip the app
        run: ditto -c -k --keepParent dist/Audiobookshelf.app Audiobookshelf.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobookshelf-mac
          path: Audiobookshelf.zip
